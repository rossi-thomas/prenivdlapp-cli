name: Build Cloudflare container image

# Builds the PRENIVDL self-hosted API image (selfhost/cloudflare/Dockerfile)
# and pushes it to GHCR under the repository's namespace. Cloudflare
# Containers (selfhost/cloudflare/wrangler.jsonc) deploys from the registry
# image, so building can happen here on GitHub-hosted runners instead of on a
# machine that has Docker installed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'selfhost/**'
      - '.github/workflows/container-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push prenivdl-api image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # The image context (selfhost/cloudflare/) cannot COPY files from the
      # parent, so stage the shared API sources into app/ first — the exact
      # same step `npm run deploy` runs locally via the predeploy hook.
      - name: Stage API sources into cloudflare/app
        run: node selfhost/cloudflare/sync-app.cjs

      - name: Verify staged tree
        run: |
          test -f selfhost/cloudflare/app/app.js
          test -f selfhost/cloudflare/app/server.js
          test -f selfhost/cloudflare/app/lib/ytdlp.js
          test -f selfhost/cloudflare/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image paths; the repository name itself can be
      # mixed case, so derive the tag in a step.
      - name: Compute image tag
        id: meta
        run: |
          echo "tag=ghcr.io/${{ github.repository }}/prenivdl-api:latest" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          sha="ghcr.io/${{ github.repository }}/prenivdl-api:sha-$(echo ${{ github.sha }} | cut -c1-7)" 
          echo "sha_tag=${sha,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: selfhost/cloudflare
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.sha_tag }}