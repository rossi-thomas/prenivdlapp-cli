name: Deploy Cloudflare Frontend

# Deploys cf-frontend/ (Pages project "prenivdl-online") to Cloudflare Pages
# whenever the frontend, its proxy function, or this workflow changes on main.
# The Pages project has NO git binding (Git Provider: No) — CI is the deploy
# path now, replacing manual `wrangler pages deploy` runs.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token, Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID — account id (654ca19a79dd27a4be7df35c9d002bbb),
#                           or pass accountId as a literal below.
# After deploy, the full captcha → verify → proxy → upstream chain is verified
# by scripts/e2e-cf-frontend.cjs before the run reports success.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cf-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'scripts/e2e-cf-frontend.cjs'

# One deploy at a time — a superseded deploy would upload an intermediate
# state and then get cancelled mid-upload, leaving Pages half-updated.
concurrency:
  group: cf-frontend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy prenivdl-online
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf-frontend
          # --branch=main matters: Pages routes deployments by branch, and
          # "main" is the production branch for prenivdl-online. Without it
          # wrangler may attach the deploy to a preview branch.
          command: pages deploy public --project-name=prenivdl-online --branch=main

      - name: Wait for edge propagation
        run: |
          for i in $(seq 1 20); do
            if curl -sf "https://prenivdl-online.pages.dev/api/captcha" >/dev/null 2>&1; then
              echo "captcha endpoint live after ${i} poll(s)"
              exit 0
            fi
            sleep 3
          done
          echo "captcha endpoint did not come up within 60s"
          exit 1

      - name: E2E full chain (captcha → verify → proxy → formats)
        run: node scripts/e2e-cf-frontend.cjs
        env:
          BASE: https://prenivdl-online.pages.dev