<style>
  :root {
    --bg: #0b0f1a;
    --bg-soft: #111828;
    --card: #151d30;
    --card-2: #1a2440;
    --border: #26324d;
    --text: #e6ecf7;
    --muted: #8fa0c0;
    --accent: #64b5ff;
    --accent-2: #a78bfa;
    --pink: #f472b6;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- Top bar ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11, 15, 26, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 28px; gap: 14px; flex-wrap: wrap;
  }
  .brand { font-weight: 800; font-size: 1.05rem; letter-spacing: 0.5px; color: var(--text); }
  .brand span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  nav { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  nav a, nav button.link {
    color: var(--muted); background: none; border: none; cursor: pointer; font-size: 0.92rem;
  }
  nav a:hover, nav button.link:hover { color: var(--text); text-decoration: none; }

  main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }

  /* ---------- Hero ---------- */
  .hero { text-align: center; margin-bottom: 34px; }
  .hero h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 10px;
  }
  .hero .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 26px; }
  .parse-box {
    display: flex; gap: 10px; max-width: 560px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;

  }
  .parse-box input::placeholder { color: var(--muted); }
  .parse-box button {
    border: none; cursor: pointer; padding: 11px 26px; border-radius: 999px;

  .parse-box button:disabled { filter: grayscale(0.6); cursor: wait; }

  .chips {

  }
  .chip {
    font-size: 0.78rem; color: var(--muted); border: 1px solid var(--border);

  .chip b { color: var(--accent); font-weight: 600; }

  /* ---------- Result ---------- */
  .result { margin-top: 8px; }
  .hidden { display: none !important; }

  .loading { text-align: center; padding: 44px 0; color: var(--muted); }
  .spinner {
    width: 38px; height: 38px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.35);
    color: var(--red); padding: 16px 20px; border-radius: var(--radius); font-size: 0.95rem;

  .thumb {
    width: 128px; height: 72px; object-fit: cover; border-radius: 10px;

  .meta { min-width: 0; flex: 1; }
  .meta h2 { font-size: 1.12rem; line-height: 1.4; margin-bottom: 8px; word-break: break-word; }
  .meta-line { color: var(--muted); font-size: 0.85rem; display: flex; gap: 14px; flex-wrap: wrap; }

  .notice {
    background: rgba(251, 191, 36, 0.07); border: 1px solid rgba(251, 191, 36, 0.3);
    color: var(--yellow); padding: 13px 16px; border-radius: 12px; font-size: 0.88rem; margin-bottom: 18px;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .dl {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);

  .dl:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-1px); }

  .dl .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    text-align: center; color: var(--muted); font-size: 0.82rem;
    padding: 22px 20px 34px; border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); }

  /* ---------- Access code modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100; background: rgba(5, 8, 16, 0.72);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow);
  }
  .modal h3 { font-size: 1.1rem; margin-bottom: 6px; }
  .modal-sub { color: var(--muted); font-size: 0.86rem; margin-bottom: 16px; }
  .modal input {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: 1rem; outline: none; margin-bottom: 16px;
  }
  .modal input:focus { border-color: var(--accent); }
  .captcha-box {
    position: relative; width: 200px; height: 200px;
    margin: 0 auto 12px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-soft);
  }
  .captcha-box img {
    position: absolute; inset: 0; width: 200px; height: 200px;

  .captcha-cells {
    position: absolute; inset: 0;

  .captcha-cells .cell { position: relative; border-radius: 8px; cursor: pointer; transition: background 0.12s; }
  .captcha-cells .cell:hover { background: rgba(37, 99, 235, 0.10); }
  .captcha-cells .cell.picked {
    outline: 3px solid var(--accent); outline-offset: -4px;

  .captcha-status { min-height: 1.3em; font-size: 0.82rem; color: #e0626e; margin: -2px 0 8px; text-align: center; }
  .link-btn {
    background: none; border: none; color: var(--accent);
    text-decoration: underline; cursor: pointer; font-size: 0.9rem;
  }
  .link-btn:disabled { opacity: 0.5; cursor: default; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    border: 1px solid var(--border); background: var(--card-2); color: var(--text);
    border-radius: 10px; padding: 9px 18px; cursor: pointer; font-size: 0.9rem;

  .modal-actions .btn-primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0b0f1a; font-weight: 700; border: none;
  }
  .modal-actions button:hover { filter: brightness(1.1); }
</style>

<script>
'use strict';

/* ================= 常量 / 平台表 ================= */
const SES_KEY = 'prenivdl_session_v1';
let session = null;
try {
  const s = JSON.parse(localStorage.getItem(SES_KEY) || 'null');
  if (s && s.token && s.exp > Date.now()) session = s.token;
} catch (_) {}
let captcha = null;       // 当前验证码 { nonce, expires, targetSig, cells[], img }
let pendingVerify = null; // resolve() for the modal promise

// 开发钩子：?api=http://host:port/api 可把请求打到别的后端（本地联调用）；
// 缺省时走同源 /api（生产行为）。
const API_BASE = (new URLSearchParams(location.search).get('api') || '/api').replace(/\/+$/, '');

const PLATFORMS = [
  { id: 'youtube',   name: 'YouTube',       re: /(^|\.)youtube\.com|youtu\.be|youtube-nocookie\.com/i },
  { id: 'tiktok',    name: 'TikTok',        re: /(^|\.)tiktok\.com/i },
  { id: 'douyin',    name: '抖音',          re: /(^|\.)douyin\.com|iesdouyin\.com|douyinpic\.com/i },
  { id: 'twitter',   name: 'Twitter / X',   re: /(^|\.)twitter\.com|(^|\.)x\.com/i },
  { id: 'instagram', name: 'Instagram',     re: /(^|\.)instagram\.com|instagr\.am/i },
  { id: 'facebook',  name: 'Facebook',      re: /(^|\.)facebook\.com|fb\.watch/i },
  { id: 'bluesky',   name: 'Bluesky',       re: /bsky\.app|bsky\.social/i },
  { id: 'threads',   name: 'Threads',       re: /(^|\.)threads\.net/i },
  { id: 'rednote',   name: '小红书',        re: /xiaohongshu\.com|xhslink\.com/i },
  { id: 'kuaishou',  name: '快手',          re: /kuaishou\.com|ksurl\.cn|gifshow\.com/i },
  { id: 'weibo',     name: '微博',          re: /(^|\.)weibo\.com|weibo\.cn/i },
  { id: 'pinterest', name: 'Pinterest',     re: /pinterest\.[a-z]+|pin\.it/i },
  { id: 'capcut',    name: 'CapCut',        re: /capcut\.com/i },
  { id: 'spotify',   name: 'Spotify',       re: /open\.spotify\.com/i,     drm: true },
  { id: 'applemusic',name: 'Apple Music',   re: /music\.apple\.com/i,      drm: true }
];
const SUPPORTED = PLATFORMS.filter((p) => !p.drm);
const MS_DURATION = new Set(['capcut']);

/* ================= DOM ================= */
const $ = (s) => document.querySelector(s);
const form = $('#parse-form');
const input = $('#url-input');
const goBtn = $('#go-btn');
const loadingEl = $('#loading');
const errorBox = $('#error-box');
const card = $('#card');
const thumb = $('#thumb');
const titleEl = $('#title');
const metaLine = $('#meta-line');
const notice = $('#notice');
const grid = $('#grid');

/* ================= 平台识别 ================= */
function detectPlatform(raw) {
  return PLATFORMS.find((p) => p.re.test(raw)) || null;
}

/* ================= 归一化：各平台响应 → [{label, kind, url}] ================= */
function normalize(platformId, data) {
  const items = [];
  const push = (url, label, kind) => {
    if (typeof url !== 'string' || !/^https?:\/\//i.test(url)) return;
    const lab = label || (kind === 'audio' ? '音频' : kind === 'image' ? '图片' : '下载');
    const n = items.filter((it) => it.url === url).length;
    items.push({ url, label: n > 0 ? `${lab} #${n + 1}` : lab, kind });
  };

  const d = data && typeof data === 'object' ? data : {};
  switch (platformId) {
    case 'youtube': {
      (d.downloads && d.downloads.video || []).forEach((f) =>
        push(f.url, [f.quality, f.format].filter(Boolean).join(' · '), 'video'));
      (d.downloads && d.downloads.audio || []).forEach((f) =>
        push(f.url, [f.quality, f.format].filter(Boolean).join(' · '), 'audio'));
      break;
    }
    case 'tiktok': {
      (d.downloads && d.downloads.video || []).forEach((u, i) => push(u, i === 0 ? '视频' : `视频 #${i + 1}`, 'video'));
      (d.downloads && d.downloads.audio || []).forEach((u, i) => push(u, i === 0 ? '音频' : `音频 #${i + 1}`, 'audio'));
      (d.downloads && d.downloads.image || []).forEach((u, i) => push(u, `图片 #${i + 1}`, 'image'));
      break;
    }
    case 'facebook': {
      (d.downloads || []).forEach((f) => push(f.url, [f.quality, f.resolution, f.ext].filter(Boolean).join(' · '), 'video'));
      break;
    }
    case 'instagram': {
      (d.media || []).forEach((m, i) => {
        const kind = m.type === 'image' ? 'image' : 'video';
        push(m.url, `${kind === 'image' ? '图片' : '视频'} #${i + 1}`, kind);
      });
      break;
    }
    case 'twitter': {
      (d.media || []).forEach((m, i) => push(m.url, m.quality || `视频 #${i + 1}`, 'video'));
      break;
    }
    case 'threads': {
      push(d.download, d.quality || '视频', 'video');
      break;
    }
    case 'bluesky': {
      if (d.videoUrl) push(d.videoUrl, '视频', 'video');
      if (d.downloadLink && d.downloadLink !== d.videoUrl) push(d.downloadLink, d.videoUrl ? '图片' : '内容', 'image');
      break;
    }
    case 'douyin': {
      (d.downloads || []).forEach((f) => push(f.url, f.label || '视频', 'video'));
      break;
    }
    case 'weibo':
    case 'kuaishou': {
      push(d.videoUrl, '视频', 'video');
      break;
    }
    case 'rednote': {
      (d.downloads || []).forEach((f) => push(f.url, f.quality || '视频', 'video'));
      (d.images || []).forEach((u, i) => push(u, `图片 #${i + 1}`, 'image'));
      break;
    }
    case 'pinterest': {
      (d.downloads || []).forEach((f) => push(f.url, [f.quality, f.format].filter(Boolean).join(' · '), 'video'));
      break;
    }
    case 'capcut': {
      (d.medias || []).forEach((m) => push(m.url, `${m.quality || 'HD'} · ${m.extension || 'mp4'}`, 'video'));
      break;
    }
    default: break;
  }

  // 兜底：平台形状漂移时，递归收集 data 里的直链（跳过缩略图/头像）。
  if (items.length === 0) {
    collectEntries(d, '', items);
  }
  return items;
}

function collectEntries(node, keyHint, out) {
  if (!node || typeof node !== 'object') return;
  if (Array.isArray(node)) { node.forEach((n) => collectEntries(n, keyHint, out)); return; }
  for (const [k, v] of Object.entries(node)) {
    if (/thumbnail|avatar|icon|captcha|cover/i.test(k)) continue;
    if (typeof v === 'string' && /^https?:\/\//i.test(v)) {
      let kind = 'video';
      let label = k;
      if (/image|photo|img|pic/i.test(k)) { kind = 'image'; label = '图片'; }
      else if (/audio|music|song/i.test(k)) { kind = 'audio'; label = '音频'; }
      if (!out.some((it) => it.url === v)) out.push({ url: v, label, kind });
    } else {
      collectEntries(v, `${keyHint}-${k}`, out);
    }
  }
}

/* ================= 图片验证：验证码 → 短时会话 ================= */
async function fetchCaptcha() {
  const res = await fetch(`${API_BASE}/captcha`, { cache: 'no-store' });
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok || !body || !body.img) {
    throw new Error((body && body.msg) || `验证码服务异常（HTTP ${res.status}）`);
  }
  return body;
}

const pickedIds = new Set(); // 用户点选的格子 id

function buildCells() {
  const wrap = $('#captcha-cells');
  wrap.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.dataset.i = String(i);
    d.setAttribute('role', 'button');
    d.setAttribute('aria-label', `格子 ${i + 1}`);
    d.addEventListener('click', () => {
      if (pickedIds.has(i)) pickedIds.delete(i); else pickedIds.add(i);
      renderPicks();
    });
    wrap.appendChild(d);
  }
}
function renderPicks() {
  [...$('#captcha-cells').children].forEach((d) => d.classList.toggle('picked', pickedIds.has(+d.dataset.i)));
}

async function loadCaptcha() {
  const img = $('#captcha-img');
  const status = $('#captcha-status');
  const okBtn = $('#code-ok');
  const reloadBtn = $('#captcha-reload');
  okBtn.disabled = true; reloadBtn.disabled = true;
  pickedIds.clear();
  renderPicks();
  img.src = ''; img.hidden = true;
  status.textContent = '正在加载验证码…';
  try {
    const cap = await fetchCaptcha();
    captcha = cap;
    $('#captcha-target').textContent = cap.targetLabel || '';
    img.src = cap.img; img.hidden = false;
    status.textContent = '';
    okBtn.disabled = false; reloadBtn.disabled = false;
  } catch (err) {
    captcha = null;
    status.textContent = err.message || '验证码加载失败';
  }
}

function openCaptchaModal() {
  return new Promise((resolve) => {
    pendingVerify = resolve;
    $('#code-modal').classList.remove('hidden');
    loadCaptcha();
  });
}
function closeCaptchaModal(result) {
  $('#code-modal').classList.add('hidden');
  if (pendingVerify) { pendingVerify(result); pendingVerify = null; }
}

async function submitCaptcha() {
  if (!captcha) { loadCaptcha(); return; }
  if (pickedIds.size === 0) {
    $('#captcha-status').textContent = '请先点击图片中的图标再验证';
    return;
  }
  const okBtn = $('#code-ok');
  const status = $('#captcha-status');
  okBtn.disabled = true;
  status.textContent = '验证中…';
  try {
    const res = await fetch(`${API_BASE}/captcha/verify`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        nonce: captcha.nonce,
        expires: captcha.expires,
        targetSig: captcha.targetSig,
        cells: captcha.cells.map((c) => c.sig),
        picks: [...pickedIds].sort((a, b) => a - b)
      })
    });
    let body = null;
    try { body = await res.json(); } catch (_) {}
    if (res.ok && body && body.session) {
      session = body.session;
      try { localStorage.setItem(SES_KEY, JSON.stringify({ token: session, exp: body.expires })); } catch (_) {}
      closeCaptchaModal(true);
      return;
    }
    status.textContent = (body && body.msg) || '验证失败，请重试';
    loadCaptcha();
  } catch (_) {
    status.textContent = '网络错误，请重试';
    okBtn.disabled = false;
  }
}

buildCells();
$('#code-ok').addEventListener('click', submitCaptcha);
$('#captcha-reload').addEventListener('click', () => { loadCaptcha(); });
$('#code-cancel').addEventListener('click', () => closeCaptchaModal(false));
$('#code-form').addEventListener('submit', (e) => { e.preventDefault(); submitCaptcha(); });
$('#code-btn').addEventListener('click', () => { openCaptchaModal(); });

/* ================= 请求 ================= */
async function apiFetch(platformId, url) {
  const params = new URLSearchParams({ url });
  const endpoint = `${API_BASE}/${platformId}?${params.toString()}`;
  const headers = {};
  if (session) headers['x-session'] = session;
  const res = await fetch(endpoint, { headers });
  if (res.status === 401) {
    const ok = await openCaptchaModal();
    if (ok) return apiFetch(platformId, url);
    throw new Error('需要完成安全验证才能使用在线解析');
  }
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((body && body.msg) || `解析服务异常（HTTP ${res.status}）`);
  return body;
}

/* ================= 渲染 ================= */
function showLoading(on) { loadingEl.classList.toggle('hidden', !on); }
function hideAll() { loadingEl.classList.add('hidden'); errorBox.classList.add('hidden'); card.classList.add('hidden'); }

// 把 yt-dlp / 上游的长串英文报错映射成易懂的中文提示。
function friendlyErr(msg) {
  const s = String(msg || '').trim();
  if (!s) return '解析失败，请稍后重试。';
  if (/Sign in to confirm you're not a bot|confirm you're not a bot|not a bot|bot check/i.test(s))
    return '平台把云端服务器判定为机器人（Bot 校验），暂时拒绝解析。可以稍后重试、换一个视频，或使用本机版（带 cookies）。';
  if (/Private video/i.test(s)) return '该视频为私享（Private）视频，无法公开解析。';
  if (/Video unavailable|This video is not available|isn't available|is not available/i.test(s))
    return '该视频当前不可用（可能已删除、被举报、地区限制或版权受限）。';
  if (/age.restriction|age-restricted|nsfw|adult content|mature content/i.test(s))
    return '该内容有年龄 / 成人限制，云端无法解析。';
  if (/members.only|member.only|join this channel|sponsor|available to members|members-only/i.test(s))
    return '该视频为会员专属内容，无法解析。';
  if (/Fresh cookies are needed|cookies are needed|reload/i.test(s))
    return '平台要求有效登录态（cookies）才能解析，云端没有账号登录，请使用本机版。';
  if (/timed out|timedout|ETIMEDOUT/i.test(s)) return '解析超时（平台响应过慢），请稍后重试。';
  if (/yt-dlp failed:/i.test(s)) {
    const detail = s.replace(/^.*yt-dlp failed:\s*ERROR:\s*/i, '').replace(/\s{2,}/g, ' ').trim();
    return '解析失败：' + (detail.slice(0, 140) || '平台侧错误') + '。';
  }
  if (/^ERROR:/i.test(s)) return '解析失败：' + s.replace(/^ERROR:\s*/i, '').slice(0, 140) + '。';
  return s;
}

function showError(msg, title) {
  errorBox.innerHTML = '';
  if (title) { const t = document.createElement('div'); t.className = 'err-title'; t.textContent = '⚠ ' + title; errorBox.appendChild(t); }
  const p = document.createElement('div');
  p.className = 'err-msg';
  p.textContent = friendlyErr(msg);
  errorBox.appendChild(p);
  errorBox.classList.remove('hidden');
}

function fmtDuration(sec, platformId) {
  let s = Number(sec);
  if (!Number.isFinite(s) || s <= 0) return '';
  if (MS_DURATION.has(platformId)) s = s / 1000;
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const secs = Math.floor(s % 60);
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(secs)}` : `${m}:${pad(secs)}`;
}

const KIND_ICON = { video: '▶', audio: '♪', image: '🖼' };

function renderSuccess(platform, data) {
  const items = normalize(platform.id, data);
  const d = data || {};

  titleEl.textContent = d.title || `${platform.name} 内容`;
  metaLine.textContent = '';
  if (d.author || d.nickname || d.username || d.uploader) {
    const span = document.createElement('span');
    span.textContent = '👤 ' + (d.author || d.nickname || d.username || d.uploader);
    metaLine.appendChild(span);
  }
  if (platform.id === 'twitter' && d.media) metaLine.appendChild(Object.assign(document.createElement('span'), { textContent: `🎞 ${d.media.length} 条` }));
  if (platform.id === 'rednote' && d.images) metaLine.appendChild(Object.assign(document.createElement('span'), { textContent: `🖼 ${d.images.length} 图` }));
  const dur = fmtDuration(d.duration, platform.id);
  if (dur) metaLine.appendChild(Object.assign(document.createElement('span'), { textContent: '⏱ ' + dur }));

  if (d.thumbnail) {
    thumb.src = d.thumbnail;
    thumb.hidden = false;
  } else {
    thumb.removeAttribute('src');
    thumb.hidden = true;
  }

  grid.innerHTML = '';
  notice.classList.add('hidden');

  if (items.length === 0) {
    notice.textContent =
      '已识别到视频信息，但云端未能提取可下载的直链。常见原因：视频有地区限制 / 会员或登录墙、' +
      '云服务器 IP 被 YouTube 等平台判定为机器人、或该视频本身无公开可下载格式。' +
      '可以稍后重试或换一个视频；完整能力请使用本机版（带 cookies 的桌面端）。';
    notice.classList.remove('hidden');
  } else {
    items.forEach((it) => {
      const a = document.createElement('a');
      a.className = 'dl k-' + it.kind;
      a.href = it.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<span class="ico">${KIND_ICON[it.kind] || '⤓'}</span><span class="lab"></span>`;
      a.querySelector('.lab').textContent = it.kind === 'video' ? '下载 ' + it.label : it.label;
      grid.appendChild(a);
    });
  }
  card.classList.remove('hidden');
}

/* ================= 主流程 ================= */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const raw = input.value.trim();
  hideAll();
  if (!raw) { showError('请先粘贴一个链接。'); return; }

  const platform = detectPlatform(raw);
  if (!platform) {
    showError('无法识别该链接的平台。支持：', '未识别的链接');
    const list = document.createElement('div');
    list.className = 'err-msg';
    list.textContent = SUPPORTED.map((p) => p.name).join('、') + '（云端不支持 Spotify / Apple Music，DRM 保护）';
    errorBox.appendChild(list);
    errorBox.classList.remove('hidden');
    return;
  }
  if (platform.drm) {
    showError(`「${platform.name}」受 DRM 保护，yt-dlp 无法提取，云端不支持。`, '不支持的平台');
    return;
  }

  goBtn.disabled = true;
  goBtn.textContent = '解析中…';
  showLoading(true);
  try {
    const json = await apiFetch(platform.id, raw);
    if (json && (json.status === true || json.status === 200)) {
      renderSuccess(platform, json.data);
    } else {
      showError((json && json.msg) || '解析失败，请稍后重试。', '解析未成功');
    }
  } catch (err) {
    const msg = err && err.message ? err.message : '解析服务异常，请稍后重试。';
    showError(msg, '出错了');
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = '解析';
    showLoading(false);
    if (!errorBox.classList.contains('hidden')) errorBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
});

/* ================= 初始化 ================= */
(function init() {
  const chipsEl = $('#chips');
  SUPPORTED.forEach((p) => {
    const span = document.createElement('span');
    span.className = 'chip';
    span.innerHTML = `<b>${p.name}</b>`;
    chipsEl.appendChild(span);
  });
  $('#platforms').textContent = '由 PRENIVDL 驱动 · Vercel';
})();
</script>
